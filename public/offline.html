<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>غير متصل بالإنترنت</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-inline: 1.5rem;
        background-color: #ffffff;
        color: #0f172a;
        font-family: "Cairo", "Segoe UI", Tahoma, system-ui, -apple-system,
          "Helvetica Neue", Arial, sans-serif;
        text-align: center;
        line-height: 1.6;
      }
      .card {
        max-width: 24rem;
        width: 100%;
      }
      .badge {
        width: 4rem;
        height: 4rem;
        margin-inline: auto;
        margin-block-end: 1.25rem;
        border-radius: 9999px;
        background-color: #2563eb;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        font-weight: 700;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #475569;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        background-color: #2563eb;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        padding-block: 0.75rem;
        padding-inline: 1.5rem;
        border-radius: 0.625rem;
        min-width: 12rem;
      }
      button:active {
        opacity: 0.85;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f172a;
          color: #f8fafc;
        }
        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">؟</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>
        هذا التطبيق يحتاج إلى اتصال بالإنترنت لعرض البيانات. تحقّق من اتصالك ثم
        أعد المحاولة.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
